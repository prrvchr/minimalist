<p id="return-link" style="display: none; margin-top: 2rem; margin-bottom: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; color: #24292e; font-weight: normal;"></p>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const referrer = document.referrer;

        // On vérifie si le visiteur vient bien de votre site prrvchr.github.io
        if (referrer && referrer.includes("prrvchr.github.io")) {
            try {
                const urlObj = new URL(referrer);
                const pathParts = urlObj.pathname.split('/').filter(p => p.length > 0);
                
                // Si pathParts[0] existe c'est OAuth2OOo (ou une autre extension), sinon c'est l'accueil général
                const extensionName = pathParts.length > 0 ? pathParts[0] : "prrvchr.github.io";
                const container = document.getElementById('return-link');

                if (container) {
                    // Style bleu officiel des liens GitHub
                    const linkStyle = "font-weight: bold; color: #0366d6; text-decoration: underline;";

                    if (window.location.pathname.includes('/fr/')) {
                        container.innerHTML = `Retourner à la documentation de <a href="${referrer}" style="${linkStyle}">${extensionName}</a>.`;
                    } else {
                        container.innerHTML = `Back to the documentation of <a href="${referrer}" style="${linkStyle}">${extensionName}</a>.`;
                    }

                    // On force l'affichage en écrasant d'éventuels conflits CSS
                    container.style.setProperty("display", "block", "important");
                }
            } catch (e) {
                console.error("Referrer analyse Error:", e);
            }
        }
    });
</script>
