<!-- Modification de la taille (font-size: 14px ou 15px selon vos préférences) -->
<p id="return-link" class="markdown-body" style="display: none; margin-top: 2rem; margin-bottom: 1.5rem; font-size: 15px; color: #24292e;"></p>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const referrer = document.referrer;

        if (referrer && referrer.includes("prrvchr.github.io")) {
            try {
                const urlObj = new URL(referrer);
                const pathParts = urlObj.pathname.split('/').filter(p => p.length > 0);

                const extensionName = pathParts.length > 0 ? pathParts : "prrvchr.github.io";
                const container = document.getElementById('return-link');

                if (container) {
                    // On ajoute 'font-weight: bold;' uniquement sur le lien pour reproduire votre style initial
                    const linkStyle = "font-weight: bold;";

                    if (window.location.pathname.includes('/fr/')) {
                        container.innerHTML = `⬅️ Retourner à la documentation de <a href="${referrer}" style="${linkStyle}">${extensionName}</a>.`;
                    } else {
                        container.innerHTML = `⬅️ Back to the documentation of <a href="${referrer}" style="${linkStyle}">${extensionName}</a>.`;
                    }

                    container.style.setProperty("display", "block", "important");
                }
            } catch (e) {
                console.error("Referrer analyse Error:", e);
            }
        }
    });
</script>
