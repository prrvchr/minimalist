<p id="return-link" style="display: none; margin-top: 2rem; margin-bottom: 1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; color: #24292e;"></p>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const referrer = document.referrer;

        if (referrer && referrer.includes("prrvchr.github.io")) {
            try {
                const urlObj = new URL(referrer);
                const pathParts = urlObj.pathname.split('/').filter(p => p.length > 0);
                
                if (pathParts.length > 0) {
                    const extensionName = pathParts[0];
                    const container = document.getElementById('return-link');

                    const linkStyle = "font-weight: bold; color: #0366d6; text-decoration: underline;";

                    if (window.location.pathname.includes('/fr/')) {
                        container.innerHTML = `Retourner à la documentation de <a href="${referrer}" style="${linkStyle}">${extensionName}</a>.`;
                    } else {
                        container.innerHTML = `Back to the documentation of <a href="${referrer}" style="${linkStyle}">${extensionName}</a>.`;
                    }

                    container.style.display = "block";
                }
            } catch (e) {
                console.error("Referrer analyse Error:", e);
            }
        }
    });
</script>
